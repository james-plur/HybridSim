[build-system]
requires = ["setuptools>=68", "wheel", "cmake>=3.14", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridsim"
version = "0.1.0"
description = "Actor-based discrete-event simulation platform (Python bindings + infrastructure)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["hybridsim*"]
