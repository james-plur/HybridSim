[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridsim-scheduler"
version = "0.1.0"
description = "Actor-based MONOLITHIC LLM scheduler bridge for hybridsim, backed by Frontier."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
scheduler = [
  "frontier-simulator",
]

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["hybridsim_scheduler*"]
